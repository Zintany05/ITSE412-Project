<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Everest</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Start of Nav Bar -->
    <div>
      <p>Everest</p>
      <ul>
        <li>Login</li>
        <li>Contact</li>
        <li>Everest At Night</li>
      </ul>
    </div>
    <!-- End of Nav Bar -->
    <!-- Start of Login -->
    <div class="container">
      <div id="login" class="form-box">
        <form action="">
          <h2 id="login-h2">Welcome To Everest</h2>
          <input
            class="input-look"
            type="email"
            name="email"
            placeholder="Email"
            required
          />

          <input
            class="input-look"
            type="password"
            name="password"
            placeholder="Password"
            required
          />
          <button class="input-look" id="login-btn" type="submit" name="login">
            Login
          </button>
          <p id="p-register">
            Dont have an account? <a id="a-register" href="#">Register</a>
          </p>
        </form>
      </div>
    </div>
    <!-- End of Login -->
    <!-- Start Of footing  -->
    <!-- End of Footing -->
  </body>
</html>
